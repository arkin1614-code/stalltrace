name: stalltrace
description: Capture foreground Android stalls in Flutter apps and symbolize native and Dart AOT stacks offline using build-matched debug symbols.
version: 0.1.0-dev.3
repository: https://github.com/arkin1614-code/stalltrace
issue_tracker: https://github.com/arkin1614-code/stalltrace/issues
topics:
  - performance
  - diagnostics
  - android
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.stalltrace
        pluginClass: StalltracePlugin
