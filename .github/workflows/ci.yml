name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart sources and tests
        run: |
          dart format --output=none --set-exit-if-changed lib test example/lib example/test
          flutter analyze --no-pub
          flutter test --no-pub
          (cd example && flutter test --no-pub)
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build the ARM64 release consumer
        working-directory: example
        run: flutter build apk --no-pub --release --obfuscate --target-platform android-arm64 --split-debug-info=build/symbols
      - name: Test the Android report store
        working-directory: example/android
        run: ./gradlew :stalltrace:testDebugUnitTest
      - name: Check the package archive
        run: dart pub publish --dry-run
